# 个人博客本地/单机部署编排：PostgreSQL + Next.js 应用
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_blog
    ports:
      - "5432:5432"
    volumes:
      - blog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: personal-blog-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/personal_blog?schema=public
      JWT_SECRET: ${JWT_SECRET:-please-change-me-to-a-long-random-secret}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_ALLOW_REGISTER: ${NEXT_PUBLIC_ALLOW_REGISTER:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      CRON_SECRET: ${CRON_SECRET:-change-me-cron-secret}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      RSSHUB_BASE_URL: ${RSSHUB_BASE_URL:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    volumes:
      - blog_uploads:/app/public/uploads

volumes:
  blog_pgdata:
  blog_uploads:
