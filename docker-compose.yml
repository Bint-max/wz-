# 本地开发用 PostgreSQL 数据库
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_blog
    ports:
      - "5432:5432"
    volumes:
      - blog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blog_pgdata:
